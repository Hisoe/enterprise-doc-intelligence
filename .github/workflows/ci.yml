name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint, Test, & Evaluate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Pytest Suite
        env:
          LLM_PROVIDER: "azure_serverless"
          AZURE_AI_FOUNDRY_ENDPOINT: "https://mock-endpoint.openai.azure.com/openai/v1/"
          AZURE_AI_FOUNDRY_API_KEY: "mock-key-for-unit-tests"
          MODEL_DEPLOYMENT_NAME: "gpt-4o"
        run: uv run pytest -v

      - name: Run Evaluation Benchmark
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AZURE_AI_FOUNDRY_ENDPOINT: ${{ secrets.AZURE_AI_FOUNDRY_ENDPOINT }}
          AZURE_AI_FOUNDRY_API_KEY: ${{ secrets.AZURE_AI_FOUNDRY_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          MODEL_DEPLOYMENT_NAME: ${{ secrets.MODEL_DEPLOYMENT_NAME }}
        run: uv run python tests/eval/run_evals.py
[project]
name = "enterprise-doc-intelligence"
version = "0.1.0"
description = "Production-grade document extraction pipeline using FastAPI, Azure OpenAI, and Pydantic v2."
authors = [{ name = "John Lloyd Padrilan", email = "padrilan.jl@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "openai>=1.30.0",
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.0",
    "langfuse>=2.30.0",
    "tenacity>=8.3.0",
    "python-multipart>=0.0.9",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "deepeval>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_intelligence"]

# Linting and Formatting powered by Ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501"] # Line length handled by formatter

# Testing Configuration
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]